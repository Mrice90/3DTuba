name: Verify development increments
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  supporting-tools:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Manifest snapshot and corruption tests
        working-directory: docs/muse/sprint-01
        run: |
          python validate_manifest.py
          python -m unittest test_validate_manifest
      - name: Offline worker smoke
        working-directory: docs/muse/sprint-01/lobby-smoke
        run: node --test smoke.test.js
      - name: Real HTTP, client and security regressions
        working-directory: prototypes/lobby-lab
        run: node --test test/*.test.js
      - name: Clean lifecycle shutdown
        working-directory: prototypes/lobby-lab
        run: node demo.js
      - name: Board event contract validation (AI-062)
        working-directory: docs/muse/sprint-02/board-events
        run: python -m unittest test_validate
      - name: Asset prompt board-scale contract (AI-063)
        working-directory: docs/muse/sprint-01/asset-prompts
        run: python -m unittest test_asset_directory
      - name: Presentation manifest coverage (AI-064)
        working-directory: docs/muse/sprint-02/presentation
        run: python -m unittest test_coverage
      - name: Event-to-presentation timeline (AI-075)
        working-directory: docs/muse/sprint-02/timeline
        run: python test_timeline.py
      - name: Bot pacing quirk characterization (AI-107)
        working-directory: docs/muse/sprint-02/ai-107-bot-pacing
        run: python test_pacing.py
      - name: Reproducible-jar tooling (AI-078/100)
        working-directory: releases/alpha-0.7.15-playable/tools
        run: python -m unittest test_make_repro_jar
      - name: Jar entry diff tool (AI-100 rework)
        working-directory: releases/alpha-0.7.15-playable/tools
        run: python -m unittest test_diff_jar_entries
      - name: Client integration example
        working-directory: prototypes/lobby-lab
        run: node examples/client-demo.js
