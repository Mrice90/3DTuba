name: Verify development increments
on:
  push:
  pull_request:
permissions:
  contents: read
  # actions: write — QA evidence bundle upload (Thalia proposal, Mathew-approved 2026-10-11).
  actions: write
jobs:
  supporting-tools:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    # One shell everywhere: the evidence wrapper is bash (Git Bash on Windows).
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      # Every check below runs through docs/muse/ci/run-and-record.sh, which
      # tees the log to qa-evidence/<slug>.log, records the exit code in
      # qa-evidence/results.jsonl, and exits with the check's own code —
      # so pass/fail semantics are unchanged. Slugs must match ^[a-z0-9-]+$.
      - name: Manifest snapshot and corruption tests
        working-directory: docs/muse/sprint-01
        run: bash "$GITHUB_WORKSPACE/docs/muse/ci/run-and-record.sh" manifest "python validate_manifest.py && python -m unittest test_validate_manifest"
      - name: Offline worker smoke
        working-directory: docs/muse/sprint-01/lobby-smoke
        run: bash "$GITHUB_WORKSPACE/docs/muse/ci/run-and-record.sh" lobby-smoke "node --test smoke.test.js"
      - name: Real HTTP, client and security regressions
        working-directory: prototypes/lobby-lab
        run: bash "$GITHUB_WORKSPACE/docs/muse/ci/run-and-record.sh" lobby-lab-tests "node --test test/*.test.js"
      - name: Clean lifecycle shutdown
        working-directory: prototypes/lobby-lab
        run: bash "$GITHUB_WORKSPACE/docs/muse/ci/run-and-record.sh" lobby-lifecycle "node demo.js"
      - name: Board event contract validation (AI-062)
        working-directory: docs/muse/sprint-02/board-events
        run: bash "$GITHUB_WORKSPACE/docs/muse/ci/run-and-record.sh" board-events "python -m unittest test_validate"
      - name: Asset prompt board-scale contract (AI-063)
        working-directory: docs/muse/sprint-01/asset-prompts
        run: bash "$GITHUB_WORKSPACE/docs/muse/ci/run-and-record.sh" asset-prompts "python -m unittest test_asset_directory"
      - name: Presentation manifest coverage (AI-064)
        working-directory: docs/muse/sprint-02/presentation
        run: bash "$GITHUB_WORKSPACE/docs/muse/ci/run-and-record.sh" presentation-coverage "python -m unittest test_coverage"
      - name: Event-to-presentation timeline (AI-075)
        working-directory: docs/muse/sprint-02/timeline
        run: bash "$GITHUB_WORKSPACE/docs/muse/ci/run-and-record.sh" timeline "python test_timeline.py"
      - name: Bot pacing quirk characterization (AI-107)
        working-directory: docs/muse/sprint-02/ai-107-bot-pacing
        run: bash "$GITHUB_WORKSPACE/docs/muse/ci/run-and-record.sh" bot-pacing "python test_pacing.py"
      - name: Reproducible-jar tooling (AI-078/100)
        working-directory: releases/alpha-0.7.15-playable/tools
        run: bash "$GITHUB_WORKSPACE/docs/muse/ci/run-and-record.sh" repro-jar "python -m unittest test_make_repro_jar"
      - name: Jar entry diff tool (AI-100 rework)
        working-directory: releases/alpha-0.7.15-playable/tools
        run: bash "$GITHUB_WORKSPACE/docs/muse/ci/run-and-record.sh" diff-jar-entries "python -m unittest test_diff_jar_entries"
      - name: SteamPipe build scripts (launch kit)
        working-directory: releases/steam
        run: bash "$GITHUB_WORKSPACE/docs/muse/ci/run-and-record.sh" steampipe "python -m unittest test_steampipe"
      - name: Client integration example
        working-directory: prototypes/lobby-lab
        run: bash "$GITHUB_WORKSPACE/docs/muse/ci/run-and-record.sh" client-demo "node examples/client-demo.js"
      # QA evidence bundle: one machine-readable summary + all check logs,
      # fetchable via the Actions artifacts API (no more relayed summaries).
      - name: Assemble QA evidence bundle
        if: always()
        run: bash "$GITHUB_WORKSPACE/docs/muse/ci/assemble-evidence.sh"
      - name: Upload QA evidence bundle
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: qa-evidence-${{ matrix.os }}
          path: qa-evidence/
          retention-days: 30
