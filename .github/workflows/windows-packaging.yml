name: Windows packaging
# AI-052-WIN: Windows shakedown for the alpha-0.7.15 playable packaging lane.
# Runs fetch -> build -> smoke on windows-latest with JDK 17, then the
# regression harness (clean PASS plus intentional-break negative coverage).
# verify.yml is untouched; this workflow is additive.
on:
  push:
    branches:
      - muse/sprint-01-content-audit
    paths:
      - 'releases/alpha-0.7.15-playable/**'
      - '.github/workflows/windows-packaging.yml'
  pull_request:
    paths:
      - 'releases/alpha-0.7.15-playable/**'
      - '.github/workflows/windows-packaging.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-packaging:
    runs-on: windows-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: cmd
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      # AI-099: build-release.bat packs the jar with tools/make-repro-jar.py
      # (same bytes as the Linux build); needs Python on PATH.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch pinned source
        working-directory: releases/alpha-0.7.15-playable
        run: call fetch-source.bat
      - name: Build release (auto-runs smoke)
        working-directory: releases/alpha-0.7.15-playable
        run: |
          call build-release.bat
          if %ERRORLEVEL% NEQ 0 (
            echo ::error::AI-052-WIN build-release exit code %ERRORLEVEL%
            for %%F in (build\deps\*.sha1) do (for /f "tokens=1" %%H in ('type "%%F"') do (echo ::error::AI-052-WIN sha1 %%~nxF=%%H))
            exit /b %ERRORLEVEL%
          )
      - name: Smoke standalone re-run (expect 5/5)
        working-directory: releases/alpha-0.7.15-playable
        run: call smoke.bat
      # AI-100: the Windows-built jar must EQUAL the canonical tracked hash —
      # printing it was not enough (04:00 printed 18998415… and claimed
      # cross-OS comparison without comparing). Fail the step on mismatch.
      - name: AI-100 jar hash asserts canonical checksum
        working-directory: releases/alpha-0.7.15-playable
        run: |
          for /f %%H in ('certutil -hashfile infinite-conquest-alpha-0.7.15.jar SHA256 ^| findstr /v ":"') do set JARHASH=%%H
          if not defined JARHASH (echo ERROR: could not hash the jar with certutil & exit /b 1)
          for /f "tokens=1" %%E in (CHECKSUMS.sha256) do set EXPECTED=%%E
          if not defined EXPECTED (echo ERROR: could not read CHECKSUMS.sha256 & exit /b 1)
          if /i "%JARHASH%"=="%EXPECTED%" (
            echo OK: Windows jar hash matches canonical CHECKSUMS.sha256
          ) else (
            echo ERROR: Windows jar hash does not match canonical CHECKSUMS.sha256
            echo   built:    %JARHASH%
            echo   expected: %EXPECTED%
            exit /b 1
          )
      # AI-100: prove the play.bat checksum gate accepts a fresh Windows
      # build without launching the GUI.
      - name: AI-100 play.bat checksum gate accepts fresh build
        working-directory: releases/alpha-0.7.15-playable
        run: call play.bat --check-only
      - name: Regression harness clean (expect REGRESSION PASS)
        working-directory: releases/alpha-0.7.15-playable
        run: call regress.bat
      - name: Negative coverage --break=pin (expect detection at build)
        working-directory: releases/alpha-0.7.15-playable
        run: call regress.bat --break=pin
      - name: Negative coverage --break=dep (expect detection at build)
        working-directory: releases/alpha-0.7.15-playable
        run: call regress.bat --break=dep
      - name: Negative coverage --break=depswap (expect detection at build)
        working-directory: releases/alpha-0.7.15-playable
        run: call regress.bat --break=depswap
      - name: Negative coverage --break=compile (expect detection at build)
        working-directory: releases/alpha-0.7.15-playable
        run: call regress.bat --break=compile
      - name: Negative coverage --break=checksum (expect detection at verify)
        working-directory: releases/alpha-0.7.15-playable
        run: call regress.bat --break=checksum
      - name: Negative coverage --break=smoke (expect detection at build)
        working-directory: releases/alpha-0.7.15-playable
        run: call regress.bat --break=smoke
