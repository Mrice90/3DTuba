name: Linux packaging
# AI-048: Linux shakedown for the alpha-0.7.15 playable packaging lane.
# Mirrors windows-packaging.yml: the regression harness (clean PASS plus
# intentional-break negative coverage) on ubuntu-24.04 with JDK 17.
# AI-073: pinned off ubuntu-latest ahead of the 2026-10-19 Ubuntu 26 migration.
# verify.yml is untouched; this workflow is additive.
on:
  push:
    branches:
      - muse/sprint-01-content-audit
    paths:
      - 'releases/alpha-0.7.15-playable/**'
      - '.github/workflows/linux-packaging.yml'
  pull_request:
    paths:
      - 'releases/alpha-0.7.15-playable/**'
      - '.github/workflows/linux-packaging.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  linux-packaging:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    # AI-058 regression check: run the whole lane with JAVA_TOOL_OPTIONS set,
    # so the "Picked up JAVA_TOOL_OPTIONS" noise line is present. The build's
    # Java version detection must read java.specification.version (not the
    # first line of `java -version`) and keep working.
    env:
      JAVA_TOOL_OPTIONS: "-Dai058=regression-check"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Regression harness clean (expect REGRESSION PASS)
        working-directory: releases/alpha-0.7.15-playable
        run: ./regress.sh
      - name: Negative coverage --break=pin (expect detection at build)
        working-directory: releases/alpha-0.7.15-playable
        run: ./regress.sh --break=pin
      - name: Negative coverage --break=dep (expect detection at build)
        working-directory: releases/alpha-0.7.15-playable
        run: ./regress.sh --break=dep
      - name: Negative coverage --break=depswap (expect detection at build)
        working-directory: releases/alpha-0.7.15-playable
        run: ./regress.sh --break=depswap
      - name: Negative coverage --break=compile (expect detection at build)
        working-directory: releases/alpha-0.7.15-playable
        run: ./regress.sh --break=compile
      - name: Negative coverage --break=checksum (expect detection at verify)
        working-directory: releases/alpha-0.7.15-playable
        run: ./regress.sh --break=checksum
      - name: Negative coverage --break=smoke (expect detection at build)
        working-directory: releases/alpha-0.7.15-playable
        run: ./regress.sh --break=smoke
      # AI-066: real-engine event dump. Fetches the pinned alpha source,
      # builds the JAR, runs 3 seeded Zeus-vs-Poseidon AI matches, and
      # validates every JSONL dump against the AI-062 board-events wire
      # format (validate.py).
      - name: AI-066 event dump (3 seeded AI matches, validate wire format)
        working-directory: releases/alpha-0.7.15-playable
        run: |
          ./fetch-source.sh
          ./build-release.sh
          ./tools/event-dump/run.sh
      # AI-079: rules bridge protocol. Builds RulesBridge.java against the
      # pinned alpha JAR and runs the protocol tests: deterministic seed-42
      # output, valid act, stale/fabricated INVALID_ACTION rejection, no
      # mutation on rejection, bot auto-play, scripted GAME_OVER, AI-062
      # validation of every event, hidden-state redaction.
      - name: AI-079 rules bridge protocol (JSONL stdin/stdout, validate)
        working-directory: releases/alpha-0.7.15-playable
        run: ./tools/rules-bridge/run.sh
